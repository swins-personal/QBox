<title>IELTS Word Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app; notebook ruled-paper ground, dictionary-entry cards, bottom tab bar */
:root {
  --paper: #fbfcfa; --ink: #18222d; --muted: #66727f; --rule: #e3ebe6;
  --card: #ffffff; --mint: #12a874; --mint-soft: #ddf5ea; --amber: #c98a12; --red: #cf3d52; --red-soft: #fbe6e9;
  --shadow: 0 1px 2px rgb(24 34 45 / .06), 0 8px 24px rgb(24 34 45 / .07);
  --f-word: "Inter", "IBM Plex Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10161d; --ink: #e8eef2; --muted: #93a1ad; --rule: #1e2a33;
  --card: #17212a; --mint: #3fd39b; --mint-soft: #133528; --amber: #e6b04a; --red: #f07a8b; --red-soft: #3a1c23;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #10161d; --ink: #e8eef2; --muted: #93a1ad; --rule: #1e2a33;
  --card: #17212a; --mint: #3fd39b; --mint-soft: #133528; --amber: #e6b04a; --red: #f07a8b; --red-soft: #3a1c23;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); -webkit-tap-highlight-color: transparent; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
h1, h2 { text-wrap: balance; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 8px 14px; }
.brand { font-family: var(--f-word); font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.brand em { color: var(--mint); font-style: normal; font-weight: 500; }
.sub { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.view[hidden] { display: none !important; }

/* home */
.hero { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.hero .due { display: flex; align-items: baseline; gap: 8px; }
.hero .due b { font-family: var(--f-word); font-size: 54px; line-height: 1; font-weight: 700; }
.bar { height: 8px; border-radius: 8px; background: var(--rule); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }
.cta { display: block; width: 100%; padding: 15px; border-radius: 14px; background: var(--mint); color: var(--paper); font-weight: 700; font-size: 16px; text-align: center; }
.cta:disabled { opacity: .45; }
.label { font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 22px 2px 8px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode { background: var(--card); border-radius: 14px; padding: 14px; text-align: left; box-shadow: var(--shadow); display: grid; gap: 2px; }
.mode b { font-size: 15px; } .mode span { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--rule); font-size: 13.5px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.note { font-size: 13px; color: var(--muted); padding: 10px 2px; }

/* study */
.studyhead { display: flex; align-items: center; gap: 10px; padding-block: 4px 12px; }
.studyhead .x { width: 36px; height: 36px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font-size: 18px; }
.studyhead .bar { flex: 1; }
.card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 22px; min-height: 340px;
  display: flex; flex-direction: column; gap: 14px; position: relative; }
.sec { font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--mint); font-weight: 700; }
.word { font-family: var(--f-word); font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -.4px; overflow-wrap: anywhere; }
.pos { font-family: var(--f-word); font-style: normal; color: var(--muted); font-size: 17px; }
.speak { position: absolute; top: 18px; right: 16px; width: 40px; height: 40px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 18px; }
.back { display: grid; gap: 10px; border-top: 1px dashed var(--rule); padding-top: 14px; }
.ko { font-size: 20px; font-weight: 700; }
.row { font-size: 14px; color: var(--muted); } .row b { color: var(--ink); font-weight: 500; }
.ex { font-family: var(--f-word); font-style: normal; font-size: 17px; line-height: 1.45; }
.wrong { display: inline-block; background: var(--red-soft); color: var(--red); border-radius: 6px; padding: 1px 7px; font-size: 13px; text-decoration: line-through; }
.hint { margin-top: auto; text-align: center; color: var(--muted); font-size: 13px; }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.grade button { padding: 14px 6px; border-radius: 14px; font-weight: 700; display: grid; gap: 1px; background: var(--card); box-shadow: var(--shadow); }
.grade button small { font-weight: 400; font-size: 11.5px; color: var(--muted); }
.g0 { color: var(--red); } .g1 { color: var(--amber); } .g2 { color: var(--mint); }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); font-size: 15.5px; border: 2px solid transparent; }
.opt.ok { border-color: var(--mint); background: var(--mint-soft); } .opt.no { border-color: var(--red); background: var(--red-soft); }
.spell { display: grid; gap: 10px; margin-top: 14px; }
.spell input { width: 100%; font: 500 22px var(--f-word); padding: 14px 16px; border-radius: 14px; border: 2px solid var(--rule); background: var(--card); color: var(--ink); }
.spell input.ok { border-color: var(--mint); } .spell input.no { border-color: var(--red); }
.diff { font-family: var(--f-mono); font-size: 15px; letter-spacing: 1px; overflow-wrap: anywhere; }
.diff .m { color: var(--red); text-decoration: underline; }
.next { display: block; width: 100%; margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--ink); color: var(--paper); font-weight: 700; }
.done { text-align: center; display: grid; gap: 12px; padding-block: 30px; }
.done b { font-family: var(--f-word); font-size: 40px; }

/* list */
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); font: inherit; margin-bottom: 10px; }
.list { display: grid; gap: 8px; }
.item { background: var(--card); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; width: 100%; }
.item .w { font-family: var(--f-word); font-size: 19px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .k { grid-column: 1; font-size: 13.5px; color: var(--muted); }
.lv { grid-row: 1 / 3; grid-column: 2; align-self: center; display: flex; gap: 3px; }
.lv i { width: 6px; height: 18px; border-radius: 3px; background: var(--rule); }
.lv i.on { background: var(--mint); }
.item.open .more { display: grid; }
.more { display: none; grid-column: 1 / -1; gap: 6px; padding-top: 8px; margin-top: 6px; border-top: 1px dashed var(--rule); }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--rule); z-index: 5;
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs nav { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs button { padding: 10px 0 12px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
.tabs button b { font-size: 19px; line-height: 1.2; font-weight: 400; }
.tabs button[aria-current="page"] { color: var(--mint); font-weight: 700; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; z-index: 6; }
@media (prefers-reduced-motion: no-preference) { .card { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(6px); opacity: .6 } } }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--red-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 12px; }
.status[hidden] { display: none; }
.link { color: var(--mint); font-weight: 700; text-decoration: underline; }

/* plan + picture cards */
.plan { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.plan .dday { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.plan .dday b { font-family: var(--f-word); font-size: 30px; }
.todo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.todo div { background: var(--paper); border-radius: 12px; padding: 10px 12px; display: grid; }
.todo b { font-family: var(--f-word); font-size: 30px; line-height: 1.1; }
.todo span { font-size: 12.5px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.stepper button { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); font-size: 16px; color: var(--ink); }
.pic { font-size: 64px; line-height: 1.1; text-align: center; }
.mnem { background: var(--mint-soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.mnem::before { content: "연상 "; font-weight: 700; color: var(--mint); }
.pron { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.tile { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 8px 12px; display: grid; justify-items: center; gap: 6px; border: 2px solid transparent; min-height: 118px; }
.tile .e { font-size: 46px; line-height: 1.1; }
.tile .t { font-size: 13px; color: var(--muted); min-height: 1.4em; text-align: center; }
.tile.ok { border-color: var(--mint); background: var(--mint-soft); } .tile.no { border-color: var(--red); background: var(--red-soft); }
.hintline { font-family: var(--f-mono); letter-spacing: 3px; color: var(--muted); font-size: 18px; }
dialog.sheet { border: 0; border-radius: 20px; padding: 18px; width: min(440px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
dialog.sheet::backdrop { background: rgb(0 0 0 / .35); }
dialog.sheet form { display: grid; gap: 6px; }
dialog.sheet label { font-size: 13px; color: var(--muted); margin-top: 6px; }
dialog.sheet input, dialog.sheet select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); width: 100%; }
.dbpanel[hidden] { display: none; }
.dbbtn { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card); font-size: 12.5px; font-weight: 700; }
.dbpanel { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 8px; margin-bottom: 14px; }
.dbpanel a { color: var(--mint); font-weight: 700; overflow-wrap: anywhere; }
.mode.wide { grid-column: 1 / -1; }
.mic { display: block; width: 100%; padding: 16px; border-radius: 14px; background: var(--mint); color: var(--paper); font-weight: 700; font-size: 16px; margin-top: 14px; }
.heard { text-align: center; font-family: var(--f-word); font-size: 22px; min-height: 1.4em; }
.playbig { display: block; margin: 6px auto; width: 92px; height: 92px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 38px; }
.phase { font-size: 12px; font-weight: 700; color: var(--amber); letter-spacing: .6px; }

/* home plan card */
.rate { display: flex; align-items: baseline; gap: 10px; }
.rate b { font-family: var(--f-word); font-size: 40px; line-height: 1; color: var(--mint); }
.bar.tall { height: 12px; }
hr.rule { border: 0; border-top: 1px dashed var(--rule); margin: 2px 0; width: 100%; }
.cta.alt { background: var(--ink); }
/* study: one screen */
.study { position: fixed; inset: 0; z-index: 8; background: var(--paper); overscroll-behavior: contain; }
.sin { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; position: relative;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stop { display: flex; align-items: center; gap: 10px; }
.stop .x { width: 34px; height: 34px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font-size: 18px; flex: none; }
.stop .bar { flex: 1; }
.smeta { display: flex; justify-content: space-between; font-size: 13px; color: var(--amber); font-weight: 700; min-height: 20px; padding: 4px 2px; }
.smeta .mono { color: var(--muted); }
.sprompt { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; overflow: hidden; }
.sanswer { flex: none; display: grid; gap: 10px; }
.qtag { font-size: 11.5px; font-weight: 700; letter-spacing: .6px; color: var(--amber); }
.big { font-size: 64px; line-height: 1.1; }
.big.huge { font-size: 96px; }
.wline { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
.w1 { font-family: var(--f-word); font-size: 36px; font-weight: 700; line-height: 1.1; letter-spacing: -.3px; overflow-wrap: anywhere; }
.ko1 { font-size: 20px; font-weight: 700; }
.ask { font-size: 13.5px; color: var(--muted); }
.ex1 { font-family: var(--f-word); font-style: normal; font-size: 15.5px; line-height: 1.4; color: var(--ink); text-align: left; width: 100%; }
.ex1 span { display: block; font-family: var(--f-body); font-style: normal; font-size: 13px; color: var(--muted); }
.sent { font-family: var(--f-word); font-size: 20px; line-height: 1.45; padding: 0 4px; }
.sent b { color: var(--mint); font-family: var(--f-mono); }
.say { width: 36px; height: 36px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 16px; }
.play { width: 96px; height: 96px; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 40px; }
.wimg { width: 100%; max-height: 34vh; object-fit: contain; border-radius: 16px; background: var(--card); }
.story { background: var(--mint-soft); border-radius: 14px; padding: 12px 14px; font-size: 18px; font-weight: 600; line-height: 1.45; width: 100%; }
.story b { color: var(--mint); margin-left: 6px; white-space: nowrap; }
.story.dim { font-size: 15px; font-weight: 500; }
.sm { font-size: 26px; }
.g4.one { grid-template-columns: 1fr; } .g4.one .ans { min-height: 52px; text-align: left; font-weight: 500; }
.g4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { min-height: 64px; padding: 10px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); font-size: 15.5px; font-weight: 600; line-height: 1.3; border: 2px solid transparent; overflow-wrap: anywhere; }
.g4.pics .ans { min-height: 92px; }
.emo { font-size: 42px; line-height: 1; }
.ans.ok { border-color: var(--mint); background: var(--mint-soft); } .ans.no { border-color: var(--red); background: var(--red-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.go { padding: 15px; border-radius: 14px; background: var(--mint); color: var(--paper); font-weight: 700; font-size: 16px; }
.ghost { padding: 14px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); font-weight: 600; }
.wide { width: 100%; }
.pass { align-self: center; margin-top: 8px; font-size: 13px; color: var(--muted); text-decoration: underline; padding: 4px 12px; }
.slots { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: 100%; }
.slot { width: 26px; height: 36px; border-bottom: 2px solid var(--muted); font-family: var(--f-mono); font-size: 22px; display: grid; place-items: center; }
.slot.fix { border-bottom-color: transparent; }
.slots.ok .slot { color: var(--mint); border-color: var(--mint); } .slots.no .slot { color: var(--red); border-color: var(--red); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.key { width: 44px; height: 48px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); font-family: var(--f-mono); font-size: 20px; }
.key:disabled { opacity: .25; }
.heard { font-family: var(--f-word); font-size: 20px; min-height: 1.4em; }
.ssheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgb(0 0 0 / .18);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; border-top: 4px solid var(--red); }
.ssheet[hidden] { display: none; }
.quitask { position: absolute; inset: 0; background: color-mix(in srgb, var(--paper) 92%, transparent); display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; z-index: 3; }
.quitask[hidden] { display: none; }
.ssheet.good { border-top-color: var(--mint); } .ssheet.bad { border-top-color: var(--red); }
.verdict { font-size: 13px; font-weight: 800; } .good .verdict { color: var(--mint); } .bad .verdict { color: var(--red); }
.sko { font-size: 22px; font-weight: 800; } .sko2 { font-size: 16px; font-weight: 600; color: var(--muted); }
.sword.sm2 { font-size: 18px; font-weight: 600; color: var(--muted); }
.forms { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; }
.forms em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--paper); background: var(--muted); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.exb { font-size: 15.5px; line-height: 1.45; } .exb b { color: var(--mint); font-weight: 800; }
.exb span { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.hint2 { text-align: center; font-size: 12px; color: var(--muted); }
.sheetrow { display: flex; gap: 12px; align-items: center; }
.spic { font-size: 46px; }
.sword { font-family: var(--f-word); font-size: 26px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sko { font-weight: 700; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chips2 span { background: var(--card); border-radius: 999px; padding: 5px 10px; font-size: 13px; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) { .shake { animation: shake .35s; } @keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } } }
@media (max-height: 700px) { .big { font-size: 52px; } .big.huge { font-size: 72px; } .w1 { font-size: 30px; } .ans { min-height: 56px; } .g4.pics .ans { min-height: 76px; } .play { width: 80px; height: 80px; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">Word <em>Box</em></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="sub" id="streak"></span><button class="dbbtn" id="planBtn">⚙︎ 목표설정</button><button class="dbbtn" id="dbBtn" aria-expanded="false">DB</button></div>
  </header>

  <dialog class="sheet" id="planDlg" aria-labelledby="planTitle">
    <form method="dialog" id="planForm">
      <h2 id="planTitle" style="margin:0 0 4px;font-size:19px">목표 설정</h2>

<script>
(() => {
/* Google Sheet "IELTS 단어 DB" is the only database.
   Reads 단어DB (columns found by header name) and 앱설정; writes 인지상태 / 마지막 복습일 / 다음 복습일 / 복습 횟수,
   and fills 이미지 / 연상 / 발음 for new rows that have none. */
const DEFAULT_SHEET = "1bZrU54WYy17DyGjA1PhxPoBhkW6yZpHqYgvmg3EHsC8";
let SHEET_ID = (() => { try { return localStorage.getItem("wb3.sheet") || DEFAULT_SHEET; } catch { return DEFAULT_SHEET; } })();
const TAB = "단어DB", SET_TAB = "앱설정";
let TAB_ID = null, sheetTitle = "";
const SERVER = "Google Sheets";
const COL = { id: "단어ID", word: "단어", ko: "뜻", syn: "유사어·관련어", forms: "변형·파생어", ex: "예문", exKo: "예문 해석",
  section: "영역", date: "학습일", raw: "손글씨 원문", score: "인지상태", memo: "수정·학습 메모", last: "마지막 복습일",
  next: "다음 복습일", count: "복습 횟수", cat: "사진 분류", fn: "명사형", fv: "동사형", fa: "형용사형", fd: "부사형", emoji: "이미지", img: "그림", mnem: "연상", pron: "발음", deck: "단어장", topic: "주제" };
const INTERVAL = [1, 1, 1, 2, 2, 3, 4, 7, 10, 14, 30];   // days until next review, by 인지상태 0–10
const MASTERED = 8;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 864e5);
const normDate = v => { const m = String(v ?? "").trim().match(/^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : ""; };
const SECNAME = { "Word test": "철자 테스트", Extra: "기타", "Irregular Verbs": "불규칙동사", "General Vocabulary": "일반 단어" };
const secLabel = s => SECNAME[s] || s;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

let words = LS.get("wb3.words", []);
let settings = { start: today(), end: addDays(today(), 60), newPerDay: 15, reviewMax: 60, ...LS.get("wb3.settings", {}) };
let dirty = LS.get("wb3.dirty", {});                 // id -> fields not yet written to the sheet
let dict = null;
let mcp = null, sample = null, ix = {}, writing = false, loaded = false;

/* ---------- learning model ---------- */
const introduced = w => w.score !== "";
const isDue = w => introduced(w) && (!w.next || w.next <= today());
function setScore(w, s) {
  w.score = Math.max(0, Math.min(10, s)); w.last = today(); w.next = addDays(today(), INTERVAL[w.score]); w.count = (+w.count || 0) + 1;
  dirty[w.id] = { ...(dirty[w.id] || {}), id: w.id, row: w.row, score: w.score, last: w.last, next: w.next, count: w.count };
  LS.set("wb3.dirty", dirty); LS.set("wb3.words", words);
  if (Object.keys(dirty).length >= 10) flush();
}
// how each kind of answer moves 인지상태
const SKILLS = {   // IELTS skill -> exercise types, each checked by appliesTo below
  picture:   ["pic2ko", "word2pic"],
  listening: ["listen", "dictate"],
  reading:   ["cloze", "synonym", "word2ko"],
  writing:   ["spell", "wcloze", "ko2word"],
  speaking:  ["speak"],
};
const appliesTo = (t, w) => ({
  listen: canSpeak, dictate: canSpeak, cloze: !!blankEx(w), wcloze: !!blankEx(w), synonym: !!firstSyn(w),
  pic2ko: !!w.mnem, word2pic: !!w.mnem,
}[t] ?? true);
const firstSyn = w => String(w.syn || "").split(/[;,]/).map(x => x.trim()).filter(x => x && x.toLowerCase() !== w.word.toLowerCase())[0] || "";
function blankEx(w) {             // example sentence with the word (or its inflected form) replaced by a gap
  if (!w.ex) return null;
  const head = w.word.split(/\s+/)[0], stem = head.slice(0, Math.max(3, Math.min(head.length, head.length > 5 ? head.length - 2 : head.length)));
  const rx = w.word.includes(" ") ? new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i") : new RegExp("\\b" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[\\w-]*", "i");
  const m = w.ex.match(rx); if (!m) return null;
  return { before: w.ex.slice(0, m.index), gap: m[0], after: w.ex.slice(m.index + m[0].length) };
}
function newDoneToday() { const k = "wb3.new." + today(); return LS.get(k, 0); }
function bumpNewDone(n) { const k = "wb3.new." + today(); LS.set(k, newDoneToday() + n); }
function todayPlan() {
  const due = words.filter(isDue).sort((a, b) => (a.next || "").localeCompare(b.next || "") || a.score - b.score);
  const reviews = due.slice(0, settings.reviewMax);
  const fresh = words.filter(w => !introduced(w));
  // new words per day = words not learned yet (including today's) / days left until the goal date
  const daysLeft = Math.max(1, daysBetween(today(), settings.end));
  const quota = Math.ceil((fresh.length + newDoneToday()) / daysLeft);
  const left = Math.max(0, quota - newDoneToday());
  const mine = fresh.filter(w => w.deck !== "핵심어휘").sort((a, b) => (b.date || "").localeCompare(a.date || "") || a.row - b.row);
  const core = fresh.filter(w => w.deck === "핵심어휘").sort((a, b) => (a.level || 9) - (b.level || 9) || a.row - b.row);
  return { reviews, news: [...mine, ...core].slice(0, left), dueAll: due.length, quota, daysLeft, freshN: fresh.length };
}

/* ---------- sheet I/O ---------- */
const valuesOf = r => { const p = r?.payload ?? r; return p?.values || p?.content?.values || []; };
function errText(e) {
  switch (e?.code) {
    case "server_not_connected": return ["Google Sheets 커넥터가 연결되어 있지 않아요. claude.ai 설정 → 커넥터에서 추가해 주세요.", null];
    case "needs_reauth": return ["Google Sheets 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.", null];
    case "selection_required": return ["Google Sheets 연결이 여러 개예요. 화면에 뜬 선택 창에서 하나를 골라 주세요.", "다시 불러오기"];
    case "not_in_manifest": case "approval_required": case "consent_required": return ["이 페이지가 Google Sheets를 쓰도록 허용해야 단어를 불러올 수 있어요.", "허용하고 불러오기"];
    case "blocked_by_policy": return ["조직 정책 때문에 이 페이지에서 Google Sheets를 쓸 수 없어요.", null];
    case "server_unavailable": case "rate_limited": return ["Google Sheets가 잠시 응답하지 않아요.", "다시 시도"];
    case "tool_error": return ["시트 작업이 실패했어요: " + String(e.message || "").slice(0, 120), "다시 시도"];
    default: return ["시트와 연결하지 못했어요.", "다시 시도"];
  }
}
function status(text, btn, fn) {
  $("#status").hidden = !text; $("#statusText").textContent = text || "";
  const b = $("#statusBtn"); b.hidden = !btn; b.textContent = btn || ""; b.onclick = fn || null;
}
const colLetter = i => { let s = ""; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - 1 - m) / 26 | 0; } return s; };

async function load() {
  if (!mcp) return;
  status(""); $("#syncNote").textContent = "시트에서 불러오는 중…";
  try {
    try {
      const meta = (await mcp.callTool(SERVER, "get_spreadsheet", { spreadsheetId: SHEET_ID, fields: ["properties.title", "sheets.properties.sheetId", "sheets.properties.title"] }, { cache: false })).payload;
      const m = meta?.content || meta || {};
      sheetTitle = m.properties?.title || "";
      TAB_ID = (m.sheets || []).find(x => x.properties?.title === TAB)?.properties?.sheetId ?? TAB_ID;
    } catch {}
    const r = await mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: `${TAB}!A1:AZ` }, { cache: false });
    const rows = valuesOf(r);
    if (!rows.length) throw { code: "tool_error", message: "빈 시트" };
    const H = rows[0].map(h => String(h).trim()); ix = {};
    for (const [k, name] of Object.entries(COL)) ix[k] = H.indexOf(name);
    if (ix.id < 0 || ix.word < 0) throw { code: "tool_error", message: "단어ID/단어 열을 찾지 못했어요" };
    const cell = (row, k) => ix[k] >= 0 ? String(row[ix[k]] ?? "").trim() : "";
    words = rows.slice(1).map((row, i) => {
      const id = cell(row, "id"), deck = cell(row, "deck") || (id.startsWith("core-") ? "핵심어휘" : "내 단어");
      const sc = cell(row, "score");
      return { row: i + 2, id, word: cell(row, "word"), ko: cell(row, "ko"), syn: cell(row, "syn"), forms: cell(row, "forms"),
        ex: cell(row, "ex"), exKo: cell(row, "exKo"), section: cell(row, "section") || "기타", date: normDate(cell(row, "date")),
        raw: cell(row, "raw"), score: sc === "" || isNaN(+sc) ? "" : +sc, memo: cell(row, "memo"),
        last: normDate(cell(row, "last")), next: normDate(cell(row, "next")), count: +cell(row, "count") || 0,
        fn: cell(row, "fn"), fv: cell(row, "fv"), fa: cell(row, "fa"), fd: cell(row, "fd"),
        emoji: cell(row, "emoji"), img: cell(row, "img"), mnem: cell(row, "mnem"), pron: cell(row, "pron"), deck,
        topic: cell(row, "topic") || cell(row, "cat"), level: +(String(cell(row, "memo")).match(/레벨 ?(\d)/)?.[1] || 0) || (deck === "핵심어휘" ? 2 : 0) };
    }).filter(w => w.id && w.word);
    for (const d of Object.values(dirty)) { const w = words.find(x => x.id === d.id); if (w) Object.assign(w, d, { row: w.row }); }
    LS.set("wb3.words", words); loaded = true;
    try {
      const sr = valuesOf(await mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: `${SET_TAB}!A1:B20` }, { cache: false }));
      const get = k => String(sr.find(r => String(r[0]).trim() === k)?.[1] ?? "").trim();
      settings = { ...settings, start: normDate(get("시작일")) || settings.start, end: normDate(get("목표일")) || settings.end,
        newPerDay: +get("하루 새 단어") || settings.newPerDay, reviewMax: +get("하루 복습 최대") || settings.reviewMax,
        minutes: +get("하루 공부 시간(분)") || settings.minutes || 30 };
      LS.set("wb3.settings", settings);
    } catch {}
    render(); flush(); fillMissing();
  } catch (e) {
    const [t, b] = errText(e);
    status(t + (words.length ? " 마지막으로 받은 목록을 보여줘요." : ""), b, load);
    $("#syncNote").textContent = "";
  }
}

async function flush() {            // write changed words in one batch: 2 calls (row check + batch update)
  if (!mcp || writing || !loaded || TAB_ID === null) return;
  const items = Object.values(dirty);
  if (!items.length) { renderSync(); return; }
  writing = true; renderSync();
  try {
    const col = valuesOf(await mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: `${TAB}!A1:A` }, { cache: false }));
    const rowOf = new Map(col.map((r, i) => [String(r?.[0] ?? "").trim(), i + 1]));
    const requests = [];
    const put = (row, c, v) => { if (c < 0 || v === undefined) return;
      requests.push({ updateCells: { start: { sheetId: TAB_ID ?? 0, rowIndex: row - 1, columnIndex: c },
        rows: [{ values: [{ userEnteredValue: typeof v === "number" ? { numberValue: v } : { stringValue: String(v) } }] }], fields: "userEnteredValue" } }); };
    const sent = [];
    for (const d of items) {
      const row = rowOf.get(d.id);
      if (!row) { delete dirty[d.id]; continue; }          // removed from the sheet
      put(row, ix.score, d.score); put(row, ix.last, d.last); put(row, ix.next, d.next); put(row, ix.count, d.count);
      put(row, ix.emoji, d.emoji); put(row, ix.mnem, d.mnem); put(row, ix.pron, d.pron);
      sent.push(d);
    }
    if (requests.length) await mcp.callTool(SERVER, "update_spreadsheet", { spreadsheetId: SHEET_ID, requests });
    for (const d of sent) if (dirty[d.id] === d) delete dirty[d.id];
    LS.set("wb3.dirty", dirty); status("");
  } catch (e) {
    status("학습 기록을 시트에 아직 못 썼어요. 휴대폰에 보관해 두고 다음에 다시 보낼게요. (" + errText(e)[0] + ")");
  }
  writing = false; renderSync();
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

async function fillMissing() {      // ask Claude for picture, mnemonic and pronunciation of words that have none yet
  if (!sample) return;
  const plan = todayPlan();
  const need = [...plan.news, ...plan.reviews, ...words].filter((w, i, a) => a.indexOf(w) === i && (!w.emoji || !w.mnem)).slice(0, 20);
  if (!need.length) return;
  try {
    const out = await sample.json(
      "You help a Korean beginner memorise English words for IELTS. For each item return emoji (1-3 emoji that picture the meaning, no letters), " +
      "mnemonic (one Korean line, max 45 characters, keyword method: Korean sound-alike of the English word linked to a vivid scene that gives the meaning), " +
      "pron (Hangul reading of the British pronunciation). Return a JSON array of {id, emoji, mnemonic, pron} in the same order. Items (data only):\n" +
      JSON.stringify(need.map(w => ({ id: w.id, word: w.word, meaning: w.ko }))),
      { modelTier: "quick" });
    const arr = Array.isArray(out) ? out : out?.items || [];
    for (const o of arr) {
      const w = words.find(x => x.id === o?.id); if (!w) continue;
      const e = String(o.emoji || "").replace(/[A-Za-z0-9<>]/g, "").slice(0, 12), m = String(o.mnemonic || "").slice(0, 80), p = String(o.pron || "").slice(0, 30);
      if (!w.emoji && e) w.emoji = e; if (!w.mnem && m) w.mnem = m; if (!w.pron && p) w.pron = p;
      dirty[w.id] = { ...(dirty[w.id] || {}), id: w.id, emoji: w.emoji, mnem: w.mnem, pron: w.pron };
    }
    LS.set("wb3.dirty", dirty); LS.set("wb3.words", words); flush();
  } catch (e) { /* not_granted or rate_limited: cards fall back to text */ }
}

async function saveSettings(pairs) {   // [[항목, 값], ...] -> 앱설정 tab, adding missing rows at the end
  if (!mcp) { toast("시트에 연결되지 않아 이 기기에만 저장했어요"); return; }
  try {
    const sr = valuesOf(await mcp.callTool(SERVER, "get_values", { spreadsheetId: SHEET_ID, range: `${SET_TAB}!A1:A30` }, { cache: false }));
    let end = Math.max(sr.length, 1);

/* ---------- study engine ----------
   One screen per question, no scrolling: prompt on top, answers in the thumb zone.
   Correct answers move on by themselves; wrong answers open a short correction sheet and come back later. */
let S = null;
const TYPES = {   // type -> how it is graded ("recog" recognition, "prod" production)
  pic2ko: "recog", word2pic: "recog", word2ko: "recog", ko2word: "recog", listen: "recog", cloze: "recog", synonym: "recog",
  spell: "prod", dictate: "prod", wcloze: "prod", speak: "prod",
};
function pickType(list, w) { const ok = shuffle(list).filter(t => appliesTo(t, w)); return ok[0] || "word2ko"; }
// reviews: recognise while weak, then read/listen in context, then produce (Duolingo/Santa style ladder)
function exerciseFor(w) {
  const s = w.score || 0;
  if (s <= 3) return pickType(["pic2ko", "word2pic", "listen"], w);
  if (s <= 6) return pickType(["word2ko", "ko2word", "cloze", "synonym", "listen"], w);
  return pickType(["spell", "dictate", "wcloze", "speak"], w);
}
function startToday() {
  const p = todayPlan(), steps = [], news = [];
  const revs = shuffle(p.reviews).map(w => ({ t: exerciseFor(w), w, phase: "복습" }));
  for (let i = 0; i < p.news.length; i += 5) {
    const batch = p.news.slice(i, i + 5);
    for (const w of batch) steps.push({ t: "learn", w, phase: "새 단어" });
    for (const w of shuffle(batch)) steps.push({ t: w.mnem ? "word2pic" : "word2ko", w, phase: "바로 확인" });
    for (const w of shuffle(batch)) steps.push({ t: "ko2word", w, phase: "바로 확인" });
    news.push(...batch);
    steps.push(...revs.splice(0, 8));                          // interleave reviews between new-word batches
  }
  steps.push(...revs);
  for (const w of shuffle(news)) steps.push({ t: w.mnem ? "pic2ko" : "word2ko", w, phase: "다시 떠올리기", late: true });  // delayed recall
  S = { steps, i: 0, right: 0, tests: 0, combo: 0, best: 0, xp: 0, today: true, newIds: new Set(news.map(w => w.id)), known: 0 };
  openStudy(); step();
}
const MODE_NAME = { picture: "연상 퀴즈", listening: "Listening", reading: "Reading", writing: "Writing", speaking: "Speaking" };
function startFree(mode) {
  const types = SKILLS[mode] || [mode];
  const pool = words.filter(w => types.some(t => appliesTo(t, w)));
  const met = pool.filter(introduced), rest = pool.filter(w => !introduced(w));
  const base = (met.length >= 8 ? met : [...met, ...rest]).sort((a, b) => (a.score === "" ? 99 : a.score) - (b.score === "" ? 99 : b.score));
  const q = shuffle(base.slice(0, 40)).slice(0, 12);
  if (!q.length) { toast("연습할 단어가 없어요"); return; }
  S = { steps: q.map(w => ({ t: pickType(types, w), w, phase: MODE_NAME[mode] })), i: 0, right: 0, tests: 0, combo: 0, best: 0, xp: 0 };
  openStudy(); step();
}

    const k = { n: "n", v: "v", adj: "a", a: "a", adv: "d" }[m[1].toLowerCase()]; if (!f[k]) f[k] = m[2].trim();
  }
  const out = [["명사", f.n], ["동사", f.v], ["형용사", f.a], ["부사", f.d]].filter(([, x]) => x);
  if (!out.length && w.forms) return `<div class="forms">${esc(w.forms)}</div>`;

// the card shown after every answer: translation (other language than the question), forms, example, Korean.
// tap anywhere or swipe left to go on.
const KO_PROMPT = new Set(["ko2word", "spell", "wcloze", "speak"]);
function answerCard(st, ok, extra = "") {

function choose(st, opts, labelFn, cls) {

    const ok = b.dataset.id === st.w.id;

function distractors(w, n, key) {   // text options: same topic first (harder); story options: other topics so they read differently
  const seen = new Set([String(w[key]).trim()]);
  const same = x => (x.topic || x.section) === (w.topic || w.section);
  const pool = words.filter(x => x.id !== w.id && x[key]);
  const near = shuffle(pool.filter(x => key === "mnem" ? !same(x) : same(x)));
  const out = [];
  for (const x of [...near, ...shuffle(pool)]) { const v = String(x[key]).trim(); if (!seen.has(v)) { seen.add(v); out.push(x); } if (out.length === n) break; }
  return out;
}

/* letter tiles: build the word by tapping letters (no phone keyboard covering the screen) */
function tiles(st, target, promptHtml) {
  const letters = [...target];
  const fixed = letters.map(c => /[ \-']/.test(c));
  const pool = letters.filter((c, i) => !fixed[i]).map(c => c.toLowerCase());
  const decoyN = pool.length <= 8 ? 2 : pool.length <= 12 ? 1 : 0, abc = "abcdefghijklmnoprstuwy";
  for (let k = 0; k < decoyN; k++) pool.push(abc[Math.random() * abc.length | 0]);
  const bank = shuffle(pool.map((c, i) => ({ c, i })));
  let typed = [];
  const render = () => {
    let j = 0;
    $("#slots").innerHTML = letters.map((c, i) => fixed[i] ? `<span class="slot fix">${c === " " ? "&nbsp;" : esc(c)}</span>` : `<span class="slot">${esc(typed[j++]?.c || "")}</span>`).join("");
    $("#bank").querySelectorAll(".key").forEach(k => k.disabled = typed.some(t => t.i === +k.dataset.i));
  };
  frame(promptHtml + `<div class="slots" id="slots"></div>`,
    `<div class="bank" id="bank">${bank.map(b => `<button class="key" data-i="${b.i}">${esc(b.c)}</button>`).join("")}</div>
     <div class="row2"><button class="ghost" id="bk">⌫ 지우기</button><button class="ghost" id="hintBtn">💡 한 글자 힌트</button></div>`, true);
  render();
  const need = letters.filter((c, i) => !fixed[i]).length;
  const check = () => {
    let j = 0; const ans = letters.map((c, i) => fixed[i] ? c : typed[j++].c).join("");
    const right = ans.toLowerCase() === target.toLowerCase(), ok = right && hints === 0;
    $("#slots").classList.add(right ? "ok" : "no"); grade(st, ok);
    if (ok) correctFlow(st);
    else wrongSheet(st, right ? `<div class="ask">힌트 ${hints}번으로 완성 · 끝에 한 번 더 나와요</div>` : `<div class="diff">내 답: ${diff(ans.toLowerCase(), target)}</div>`);
  };
  $("#bank").onclick = e => { const k = e.target.closest(".key"); if (!k || k.disabled || typed.length >= need) return;
    typed.push(bank.find(b => b.i === +k.dataset.i)); render(); if (typed.length === need) check(); };
  $("#bk").onclick = () => { typed.pop(); render(); };
  let hints = 0;
  $("#hintBtn").onclick = () => {   // fix the typed letters to match, then place the next right letter
    const want = letters.filter((c, i) => !fixed[i]).map(c => c.toLowerCase());
    let k = 0; while (k < typed.length && typed[k].c === want[k]) k++;
    typed = typed.slice(0, k);
    const hit = bank.find(b => b.c === want[k] && !typed.some(t => t.i === b.i)); if (!hit) return;
    typed.push(hit); hints++; render(); $("#hintBtn").textContent = `💡 힌트 ${hints}번`;
    if (typed.length === need) check();

}

function step() {
  if (S.i >= S.steps.length) return finish();
  delete $("#sAnswer").dataset.lock; $("#sAnswer").onclick = null;
  const st = S.steps[S.i], w = st.w;
  switch (st.t) {
    case "learn": {
      frame(`${tag(w, st)}
        ${imgHtml(w)}<div class="wline"><span class="w1">${esc(w.word)}</span>${sayBtn(w)}</div>${w.pron ? `<div class="pron">[${esc(w.pron)}]</div>` : ""}
        <div class="ko1">${esc(w.ko)}</div>${mnemHtml(w)}
        ${w.ex ? `<div class="ex1">${esc(w.ex)}${w.exKo ? `<span>${esc(w.exKo)}</span>` : ""}</div>` : ""}`,
        st.relearn ? `<button class="go wide" id="learnGo">다시 봤어요, 퀴즈로 →</button>` : `<div class="row2"><button class="ghost" id="known">이미 알아요 (확인 문제)</button><button class="go" id="learnGo">봤어요, 퀴즈로 확인 →</button></div>`);
      if (canSpeak) setTimeout(() => say(w.word), 200);
      setScore(w, introduced(w) ? w.score : 1);
      $("#learnGo").onclick = next;
      // "already know it": self-reports are unreliable, so check with one question first; skip the word only if it is right
      if (!st.relearn) $("#known").onclick = () => { S.steps.splice(S.i + 1, 0, { t: w.mnem ? "pic2ko" : "word2ko", w, phase: "아는 단어 확인", knownCheck: true }); next(); };
      break;
    }
    case "pic2ko":   // keyword story (+ word, sound) -> meaning
      frame(`${tag(w, st)}${imgHtml(w)}<div class="wline"><span class="w1">${esc(w.word)}</span>${sayBtn(w)}</div>
        <div class="story">${esc(cueOf(w))}<b>→ ?</b></div><div class="ask">연상 이야기의 끝, 뜻은?</div>`, "", true);
      if (canSpeak) setTimeout(() => say(w.word), 200);
      choose(st, optionsFor(w, "ko"), o => esc(shortKo(o.ko)));
      break;
    case "word2pic":  // word (+ sound) -> its keyword story
      frame(`${tag(w, st)}<div class="wline"><span class="w1">${esc(w.word)}</span>${sayBtn(w)}</div><div class="ask">이 단어의 연상 이야기는?</div>`, "", true);
      if (canSpeak) setTimeout(() => say(w.word), 200);
      choose(st, optionsFor(w, "mnem"), o => esc(cueOf(o)), "one");
      break;
    case "word2ko":
      frame(`${tag(w, st)}<div class="wline"><span class="w1">${esc(w.word)}</span>${sayBtn(w)}</div>${w.pron ? `<div class="pron">[${esc(w.pron)}]</div>` : ""}<div class="ask">뜻은?</div>`, "", true);
      if (canSpeak) setTimeout(() => say(w.word), 200);
      choose(st, optionsFor(w, "ko"), o => esc(shortKo(o.ko)));
      break;
    case "ko2word":
      frame(`${tag(w, st)}${imgHtml(w)}<div class="ko1" style="font-size:24px">${esc(w.ko)}</div>${w.mnem ? `<div class="story dim">${esc(cueOf(w))}</div>` : ""}<div class="ask">영어 단어는?</div>`, "", true);
      choose(st, optionsFor(w, "word"), o => esc(o.word));
      break;
    case "listen":
      frame(`${tag(w, st)}<button class="play" data-say="${esc(w.word)}" aria-label="다시 듣기">▶</button><div class="ask">듣고 뜻을 고르세요</div>`, "", true);
      setTimeout(() => say(w.word), 250);
      choose(st, optionsFor(w, "ko"), o => esc(shortKo(o.ko)));
      break;
    case "cloze": {
      const b = blankEx(w);
      frame(`${tag(w, st)}<div class="sent">${esc(b.before)}<b>_____</b>${esc(b.after)}</div><div class="ask">빈칸에 맞는 단어는?</div>`, "", true);
      choose(st, optionsFor(w, "word"), o => esc(o.word));
      break;
    }
    case "synonym": {
      const syn = firstSyn(w);
      const others = shuffle(words.filter(x => x.id !== w.id && firstSyn(x) && firstSyn(x).toLowerCase() !== syn.toLowerCase())).slice(0, 3);
      frame(`${tag(w, st)}<div class="wline"><span class="w1">${esc(w.word)}</span>${sayBtn(w)}</div><div class="ask">같은 뜻의 단어는? (IELTS 바꿔 말하기)</div>`, "", true);
      choose(st, shuffle([{ id: w.id, syn }, ...others.map(x => ({ id: x.id, syn: firstSyn(x) }))]), o => esc(o.syn));
      break;
    }
    case "spell": {
      tiles(st, w.word, `${tag(w, st)}${imgHtml(w)}<div class="ko1">${esc(w.ko)}</div>`);
      break;
    }
    case "dictate":
      tiles(st, w.word, `${tag(w, st)}<button class="play" data-say="${esc(w.word)}" aria-label="다시 듣기">▶</button><div class="ask">들리는 단어를 만드세요</div>`);
      setTimeout(() => say(w.word), 250);
      break;
    case "wcloze": {
      const b = blankEx(w);
      tiles(st, b.gap, `${tag(w, st)}<div class="sent">${esc(b.before)}<b>_____</b>${esc(b.after)}</div><div class="ask">${esc(shortKo(w.ko))} · 빈칸을 채우세요</div>`);
      break;
    }
    case "speak": {
      frame(`${tag(w, st)}${imgHtml(w)}<div class="ko1">${esc(w.ko)}</div><div class="ask">영어로 소리 내 말해 보세요</div><div class="heard" id="heard"></div>`,
        `${dict ? `<button class="go" id="mic">🎤 말하기</button>` : ""}<button class="ghost wide" id="reveal">${dict ? "정답 듣기" : "말했어요 · 정답 듣기"}</button>`, true);
      const selfCheck = () => {
        $("#sAnswer").innerHTML = `<div class="wline" style="justify-content:center"><span class="w1">${esc(w.word)}</span></div>
          <div class="row2"><button class="ghost" id="no">틀렸어요</button><button class="go" id="yes">맞게 말했어요</button></div>`;
        say(w.word);
        $("#no").onclick = () => { grade(st, false); wrongSheet(st); };
        $("#yes").onclick = () => { grade(st, true); next(); };
      };
      $("#reveal").onclick = selfCheck;
      if (dict) $("#mic").onclick = () => {
        let said = "";
        const off = [dict.onFinal(({ text }) => { said += " " + text; }), dict.onPartial(({ text }) => { $("#heard").textContent = (said + " " + text).trim(); })];
        dict.start({ language: "en" }).then(() => { $("#mic").textContent = "⏹ 다 말했어요"; $("#mic").onclick = async () => {
          await dict.stop().catch(() => {}); off.forEach(f => f());
          const heard = said.trim().toLowerCase().replace(/[^a-z' -]/g, "");
          $("#heard").textContent = said.trim() || "(못 들었어요)";
          if (heard.split(/\s+/).join(" ").includes(w.word.toLowerCase())) { grade(st, true); correctFlow(st); } else selfCheck();
        }; }).catch(err => { off.forEach(f => f()); $("#mic")?.remove(); if (err?.code !== "dismissed") toast("이 화면에서는 마이크를 쓸 수 없어요"); });
      };
      break;
    }
  }
}
function diff(a, b) {
  if (!a) return "<span class='sub'>(빈칸)</span>";
  return [...a].map((c, i) => c === (b[i] || "").toLowerCase() ? esc(c) : `<span class="m">${esc(c)}</span>`).join("");
}
function finish() {
  if (S.today) bumpNewDone(S.newIds?.size || 0);
  flush();
  $("#prog").style.width = "100%";
  const pct = S.tests ? Math.round(S.right / S.tests * 100) : 100;
  const wrong = words.filter(w => S.wrongIds?.has(w.id));
  const passRate = S.tests + (S.passes || 0) ? Math.round((S.passes || 0) / (S.tests + (S.passes || 0)) * 100) : 0;
  frame(`<div class="qtag">${S.today ? "오늘의 학습 완료" : "연습 완료"}</div><div class="big">${pct >= 90 ? "🏆" : pct >= 70 ? "🎉" : "💪"}</div>
    <div class="w1" style="text-align:center">${pct}%</div>
    <div class="ask">${S.tests}문제 · 패스 ${S.passes || 0}번 (${passRate}%) · 최고 콤보 ${S.best} · +${S.xp} XP${S.newIds?.size ? ` · 새 단어 ${S.newIds.size - (S.known || 0)}개` : ""}${S.known ? ` · 이미 아는 단어 ${S.known}개` : ""}</div>
    ${wrong.length ? `<div class="chips2">${wrong.slice(0, 12).map(w => `<span>${esc(w.word)}</span>`).join("")}</div><div class="ask">한 번이라도 틀린 단어 · 내일 먼저 나와요</div>` : ""}`,
    `<button class="go wide" id="home2">처음으로</button>`);
  $("#home2").onclick = () => show("home");
}

/* ---------- time attack: 60 seconds, word -> meaning, combo bonus, wrong -5s ---------- */
function startAttack() {
  const pool = words.filter(introduced).length >= 12 ? words.filter(introduced) : words.filter(w => w.ko);
  if (pool.length < 4) { toast("단어가 더 있어야 해요"); return; }
  const A = { left: 60, score: 0, combo: 0, best: 0, wrong: new Map(), timer: null, end: Date.now() + 60000 };
  S = { steps: [], i: 0, right: 0, tests: 0, combo: 0, best: 0, xp: 0, attack: A };
  show("study");
  $("#sCount").textContent = ""; $("#prog").style.width = "100%";
  const tick = () => {
    A.left = Math.max(0, (A.end - Date.now()) / 1000);
    $("#prog").style.width = (A.left / 60 * 100) + "%"; $("#sCount").textContent = `${Math.ceil(A.left)}초`;
    if (A.left <= 0) return endAttack();
    A.timer = requestAnimationFrame(tick);
  };
  const q = () => {
    const w = pool[Math.random() * pool.length | 0], st = { t: "word2ko", w };
    $("#sSheet").hidden = true;
    $("#sPrompt").innerHTML = `<div class="qtag">⚡ 타임어택 · ${A.score}점</div><div class="wline"><span class="w1">${esc(w.word)}</span></div>`;
    $("#sCombo").textContent = A.combo >= 2 ? `🔥 ${A.combo}` : ""; $("#sXp").textContent = `${A.score}점`;
    $("#sAnswer").innerHTML = grid(optionsFor(w, "ko"), o => esc(shortKo(o.ko)));
    delete $("#sAnswer").dataset.lock;
    $("#sAnswer").onclick = e => {
      const b = e.target.closest(".ans"); if (!b || $("#sAnswer").dataset.lock || A.left <= 0) return; $("#sAnswer").dataset.lock = 1;
      const ok = b.dataset.id === w.id;
      $("#sAnswer").querySelector(`[data-id="${CSS.escape(w.id)}"]`).classList.add("ok");
      if (ok) { A.combo++; A.best = Math.max(A.best, A.combo); A.score += 1 + (A.combo >= 5 ? 1 : 0); setTimeout(q, 250); }
      else { b.classList.add("no"); A.combo = 0; A.end -= 5000; A.wrong.set(w.id, w); $("#sPrompt").classList.add("shake"); setTimeout(q, 700); }
    };
  };
  const endAttack = () => {
    cancelAnimationFrame(A.timer);
    const best = Math.max(LS.get("wb3.attackBest", 0), A.score); LS.set("wb3.attackBest", best); addXp(A.score * 3);
    frame(`<div class="qtag">⚡ 타임어택 끝</div><div class="big">${A.score >= best ? "🏆" : "⏱️"}</div><div class="w1" style="text-align:center">${A.score}점</div>
      <div class="ask">최고 기록 ${best}점 · 최고 콤보 ${A.best}</div>
      ${A.wrong.size ? `<div class="chips2">${[...A.wrong.values()].slice(0, 12).map(w => `<span>${esc(w.word)} · ${esc(shortKo(w.ko))}</span>`).join("")}</div>` : ""}`,
      `<div class="row2"><button class="ghost" id="home2">처음으로</button><button class="go" id="again">한 판 더</button></div>`);
    $("#home2").onclick = () => show("home"); $("#again").onclick = startAttack;
    for (const w of A.wrong.values()) if (introduced(w)) setScore(w, Math.min(w.score, 3));   // missed words come back tomorrow
    flush();
  };
  A.timer = requestAnimationFrame(tick); q();
}

/* answers and passes per day (this device): pass rate */
function logAnswer(kind) { const k = "wb3.log." + today(), v = LS.get(k, { ok: 0, no: 0, pass: 0 }); v[kind]++; LS.set(k, v); }
function passRate(days = 7) {
  let a = 0, p = 0; for (let i = 0; i < days; i++) { const v = LS.get("wb3.log." + addDays(today(), -i), null); if (v) { a += v.ok + v.no + v.pass; p += v.pass; } }
  return a ? Math.round(p / a * 100) : 0;
}
/* XP per day (this device) */
function addXp(n) { const k = "wb3.xp." + today(); LS.set(k, LS.get(k, 0) + n); }
const xpToday = () => LS.get("wb3.xp." + today(), 0);

$("#startBtn").onclick = startToday;
$("#attackBtn").onclick = startAttack;
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => startFree(b.dataset.mode));
$("#sPass").onclick = passStep;
// leaving mid-session asks first (finished sessions leave at once)
function quitNow() { if (S?.attack) cancelAnimationFrame(S.attack.timer); flush(); $("#quitAsk").hidden = true; show("home"); }
$("#quit").onclick = () => {
  if (!S || $("#home2") || S.i >= S.steps.length && !S.attack) return quitNow();
  $("#quitAsk").hidden = false; $("#quitKeep").focus();
};
$("#quitKeep").onclick = e => { e.stopPropagation(); $("#quitAsk").hidden = true; };
$("#quitYes").onclick = e => { e.stopPropagation(); quitNow(); };
document.addEventListener("click", e => { const s = e.target.closest("[data-say]"); if (s) { e.stopPropagation(); say(s.dataset.say); } }, true);


/* ---------- list ---------- */
function renderList() {
  const q = ($("#q").value || "").trim().toLowerCase();
  const items = words.filter(w => !q || [w.word, w.ko, w.syn].some(v => (v || "").toLowerCase().includes(q)));
  $("#list").innerHTML = items.length ? items.slice(0, 300).map(w => {
    const s = introduced(w) ? Math.round(w.score / 2) : 0;
    return `<button class="item" data-open="${esc(w.id)}"><span class="w">${esc(w.word)}</span>
      <span class="lv" aria-label="인지상태 ${introduced(w) ? w.score + "/10" : "아직 안 배움"}">${Array.from({ length: 5 }, (_, i) => `<i class="${i < s ? "on" : ""}"></i>`).join("")}</span>
      <span class="k">${esc(w.deck)} · ${esc(w.ko)}</span><span class="more">${details(w)}</span></button>`;
  }).join("") + (items.length > 300 ? `<p class="note">${items.length - 300}개 더 있어요. 검색으로 좁혀 보세요.</p>` : "")
    : `<p class="note">${words.length ? "찾는 단어가 없어요." : "아직 단어가 없어요."}</p>`;
}
$("#q").addEventListener("input", renderList);
$("#list").addEventListener("click", e => { const it = e.target.closest("[data-open]"); if (it && !e.target.closest("[data-say]")) it.classList.toggle("open"); });

/* ---------- stats ---------- */
function renderStats() {
  const m = dayCounts();
  const days = Array.from({ length: 28 }, (_, i) => addDays(today(), i - 27));
  const max = Math.max(1, ...days.map(d => m[d] || 0));
  const hard = words.filter(w => introduced(w) && w.score <= 3 && w.count > 1).sort((a, b) => a.score - b.score || b.count - a.count).slice(0, 12);
  const byDeck = ["내 단어", "핵심어휘"].map(d => { const ws = words.filter(w => w.deck === d); return [d, ws.length, ws.filter(introduced).length, ws.filter(w => introduced(w) && w.score >= MASTERED).length]; }).filter(r => r[1]);
  $("#v-stats").innerHTML = `
    <div class="hero"><div class="sub">최근 4주, 날짜별 공부한 단어 수</div>
      <svg viewBox="0 0 280 70" width="100%" role="img" aria-label="일별 공부한 단어 수">${days.map((d, i) =>
        `<rect x="${i * 10 + 1}" y="${64 - (m[d] || 0) / max * 58}" width="8" height="${Math.max(1, (m[d] || 0) / max * 58)}" rx="2" fill="${m[d] ? "var(--mint)" : "var(--rule)"}"><title>${d}: ${m[d] || 0}</title></rect>`).join("")}
        <line x1="0" y1="65" x2="280" y2="65" stroke="var(--rule)"/></svg>
      <div class="legend"><span style="--c:var(--amber)">연속 <b class="mono">${calcStreak()}</b>일</span></div></div>
    <div class="label">단어장별 진도</div>
    <div class="list">${byDeck.map(([d, n, s, k]) => `<div class="item"><span class="w" style="font-size:16px">${esc(d)}</span><span class="lv mono sub">외움 ${k}</span><span class="k">전체 ${n} · 배움 ${s}</span></div>`).join("")}</div>
    <div class="label">자꾸 틀리는 단어</div>
    <div class="list">${hard.length ? hard.map(w => `<div class="item"><span class="w">${esc(w.word)}</span><span class="lv mono sub">인지 ${w.score}</span><span class="k">${esc(w.ko)}${w.mnem ? " · " + esc(w.mnem) : ""}</span></div>`).join("") : `<p class="note">아직 없어요.</p>`}</div>`;
}

/* ---------- nav ---------- */
function show(v) {
  ["home", "study", "list", "stats"].forEach(k => $("#v-" + k).hidden = k !== v);
  document.querySelector(".tabs").hidden = v === "study";
  document.querySelectorAll("[data-tab]").forEach(b => b.dataset.tab === (v === "study" ? "home" : v) ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (v === "list") renderList(); if (v === "stats") renderStats(); if (v === "home") renderHome();
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if (!$("#v-study").hidden) flush(); show(b.dataset.tab); });
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2200); }

/* ---------- DB panel ---------- */
const TEMPLATE_HEAD = ["단어ID","단어","뜻","유사어·관련어","변형·파생어","예문","예문 해석","영역","학습일","원본 페이지","원본 행","손글씨 원문","인지상태","수정·학습 메모","마지막 복습일","다음 복습일","복습 횟수","교체 PDF","명사형","동사형","형용사형","부사형","자료 출처","사진 분류","과거형","과거분사","이미지","연상","발음","단어장","주제"];
const TEMPLATE_ROW = ["my-0001","significant","중요한, 상당한","important; considerable","n. significance; adv. significantly","There was a significant rise in prices.","가격이 상당히 올랐다.","Reading","2026-11-28","","","significant","","","","","0","","significance","","significant","significantly","예시 행 (지우고 쓰세요)","","","","📈❗","시그니(sign 신호)가 피컨트! 크게 보임 → 중요한","시그니피컨트","내 단어","학술 형용사·부사"];
function renderDb() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
  $("#dbLink").href = url; $("#dbLink").textContent = sheetTitle ? `${sheetTitle} 열기 ↗` : url;
  $("#dbMeta").textContent = loaded ? `단어 ${words.length}개 · 탭 ${TAB}${SHEET_ID === DEFAULT_SHEET ? " · 기본 DB" : " · 직접 연결한 DB"}` : "아직 불러오지 못했어요";
  $("#dbReset").hidden = SHEET_ID === DEFAULT_SHEET;
}
$("#dbBtn").onclick = () => { const p = $("#dbPanel"); p.hidden = !p.hidden; $("#dbBtn").setAttribute("aria-expanded", String(!p.hidden)); renderDb(); };
function useSheet(id) {
  SHEET_ID = id; try { id === DEFAULT_SHEET ? localStorage.removeItem("wb3.sheet") : localStorage.setItem("wb3.sheet", id); } catch {}
  words = []; dirty = {}; LS.set("wb3.dirty", dirty); TAB_ID = null; sheetTitle = ""; loaded = false; render(); renderDb(); load().then(renderDb);
}
$("#dbSave").onclick = () => {
  const v = $("#dbInput").value.trim(), id = (v.match(/\/d\/([A-Za-z0-9_-]{20,})/) || v.match(/^([A-Za-z0-9_-]{20,})$/) || [])[1];
  if (!id) { toast("시트 링크나 ID를 확인해 주세요"); return; }
  if (Object.keys(dirty).length) flush();
  useSheet(id); $("#dbInput").value = ""; toast("새 DB를 불러오는 중이에요");
};
$("#dbReset").onclick = () => useSheet(DEFAULT_SHEET);
let downloads = null;
$("#dbTemplate").onclick = async () => {
  const q = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const csv = "\ufeff" + [TEMPLATE_HEAD, TEMPLATE_ROW].map(r => r.map(q).join(",")).join("\r\n");
  if (!downloads) downloads = await window.claude?.use?.("downloads");
  if (!downloads) { toast("이 화면에서는 파일을 내려받을 수 없어요"); return; }
  try { await downloads.save({ filename: "IELTS_단어DB_양식.csv", data: new Blob([csv], { type: "text/csv" }) }); }
  catch (e) { if (e?.code === "host_unavailable") toast("이 앱에서는 파일 저장이 안 돼요. 브라우저나 컴퓨터에서 열어 주세요");
    else if (e?.code !== "declined") toast("양식을 내려받지 못했어요"); }
};

boot();
})();
</script>
